<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f3"><title>shiro — tasks</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script type="module" src="/app.js"></script></head>
<body><div class="orb one"></div><div class="orb two"></div><div id="skeleton" aria-label="読み込み中"><div class="sk-head shimmer"></div><div class="sk-box shimmer"></div><div class="sk-tabs shimmer"></div><div class="sk-row shimmer"></div><div class="sk-row shimmer"></div><div class="sk-row shimmer"></div></div>
<div class="app"><aside><a class="brand" href="/" aria-label="shiro ホーム"><span class="brand-icon">s</span>shiro<span class="brand-dot">.</span></a><div class="side-label">WORKSPACE</div><button class="side-item selected" id="home"><span>▦</span> マイタスク <span id="sideCount">0</span></button><button class="side-item" id="sideDone"><span>✓</span> 完了したタスク</button><div class="side-bottom"><span class="live-dot"></span><span id="storageSide">この端末に保存</span><button class="icon-button" id="settingsSide" aria-label="設定">⚙</button></div></aside>
<main><header><a class="mobile-brand" href="/">shiro<span>.</span></a><div class="breadcrumb">ワークスペース <span>/</span> マイタスク</div><div class="header-actions"><button class="icon-button" id="searchButton" aria-label="検索">⌕</button><button id="account" class="avatar" aria-label="アカウント設定">G</button></div></header>
<section class="content"><div class="page-heading"><div><div id="date" class="eyebrow"></div><h1>マイタスク<span class="heading-dot">.</span></h1></div><span class="count-pill" id="totalCount">0 tasks</span></div>
<form id="composer" class="glass composer"><textarea id="memo" rows="2" placeholder="メモする…" aria-label="メモする" autofocus></textarea><div class="composer-bottom"><div class="composer-tools"><button type="button" class="tool" id="aiButton" aria-label="AIでメモをタスクに分解">✧ <span>AIで整理</span></button><span class="key-hint">⌘ ↵</span></div><button class="add-button" type="submit" aria-label="タスクを追加">↑</button></div></form>
<div class="list-toolbar"><div class="tabs" role="tablist" aria-label="ステータス"><button role="tab" data-filter="all" aria-selected="true">すべて <span></span></button><button role="tab" data-filter="todo" aria-selected="false">未着手 <span></span></button><button role="tab" data-filter="doing" aria-selected="false">進行中 <span></span></button><button role="tab" data-filter="done" aria-selected="false">完了 <span></span></button></div><button class="icon-button sort" id="sort" aria-label="並び順を変更">↕</button></div>
<div id="searchWrap" hidden><input id="search" placeholder="タスクを検索" aria-label="タスクを検索"><button class="icon-button" id="closeSearch" aria-label="検索を閉じる">×</button></div><div class="list-caption"><span id="listLabel">すべてのタスク</span><span class="swipe-label">← 戻す <span>·</span> 進める →</span></div><div id="tasks" aria-live="polite"></div><div id="empty" hidden><div class="empty-symbol">＋</div><span id="emptyText">最初のメモを追加</span></div><footer><span class="live-dot"></span><span id="saveState">この端末に保存</span><span class="footer-mark">shiro</span></footer></section></main></div>
<div id="toast" role="status"></div><dialog id="settings"><form method="dialog"><button class="dialog-close icon-button" aria-label="閉じる">×</button></form><div class="dialog-mark">s</div><h2>アカウント</h2><p id="accountInfo">この端末に保存中</p><button id="googleLogin" class="google-button">G　Googleでログイン</button><p id="authNotice" class="notice"></p><button id="export" class="text-button">データを書き出す</button></dialog>
<dialog id="editDialog"><form id="editForm"><h2>タスクを編集</h2><textarea id="editText" rows="5" aria-label="タスク本文" required maxlength="4000"></textarea><div class="edit-actions"><button type="button" id="deleteTask" class="text-button danger">削除</button><button type="button" id="cancelEdit" class="text-button">キャンセル</button><button class="primary" type="submit">保存</button></div></form></dialog></body></html>
